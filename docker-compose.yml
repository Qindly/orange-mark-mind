# ============================================================================
# Orange Mark Mind - Docker Compose 配置
# 用于本地开发和服务器部署
# 端口分配: 60100 (前端), 60101 (PostgreSQL), 60102 (Redis), 60103 (后端内部)
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL 数据库
  # 端口: 60101
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: omm-postgres
    restart: unless-stopped
    ports:
      - "60101:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orange_mark_mind}
      POSTGRES_USER: ${POSTGRES_USER:-omm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omm_password_change_me}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-omm_user} -d ${POSTGRES_DB:-orange_mark_mind}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omm-network

  # --------------------------------------------------------------------------
  # Redis 缓存
  # 端口: 60102
  # 用于: JWT Refresh Token 存储、会话管理、缓存
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: omm-redis
    restart: unless-stopped
    ports:
      - "60102:6379"
    environment:
      TZ: Asia/Shanghai
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password_change_me}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-redis_password_change_me}",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omm-network

  # --------------------------------------------------------------------------
  # 后端 API 服务
  # 内部端口: 60100 (仅通过 Docker 网络访问，前端 nginx 代理)
  # --------------------------------------------------------------------------
  # --------------------------------------------------------------------------
  # Database migrations (one-shot helper)
  # Run manually: docker compose run --rm migrate
  # --------------------------------------------------------------------------
  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    entrypoint:
      [
        "migrate",
        "-path=/migrations",
        "-database=postgres://${POSTGRES_USER:-omm_user}:${POSTGRES_PASSWORD:-omm_password_change_me}@postgres:5432/${POSTGRES_DB:-orange_mark_mind}?sslmode=disable",
      ]
    command: ["up"]
    networks:
      - omm-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omm-backend
    restart: unless-stopped
    # 不暴露到宿主机，仅通过 Docker 内部网络访问
    expose:
      - "60100"
    environment:
      # 服务配置
      PORT: 60100
      GIN_MODE: ${GIN_MODE:-release}

      # 数据库配置（使用容器内部网络）
      DATABASE_URL: postgres://${POSTGRES_USER:-omm_user}:${POSTGRES_PASSWORD:-omm_password_change_me}@postgres:5432/${POSTGRES_DB:-orange_mark_mind}?sslmode=disable

      # Redis 配置（使用容器内部网络）
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_change_me}@redis:6379/0

      # JWT 配置
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_change_me}
      JWT_ACCESS_TOKEN_EXPIRE: ${JWT_ACCESS_TOKEN_EXPIRE:-900}
      JWT_REFRESH_TOKEN_EXPIRE: ${JWT_REFRESH_TOKEN_EXPIRE:-604800}

      # 加密配置
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-your_32_byte_encryption_key_here}

      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:60100/health",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - omm-network

  # --------------------------------------------------------------------------
  # 前端服务 (Nginx)
  # 端口: 60100 (外部访问入口)
  # 负责: 静态文件服务 + API 代理
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omm-frontend
    restart: unless-stopped
    ports:
      - "60100:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - omm-network

# 数据卷 - 持久化存储
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# 网络
networks:
  omm-network:
    driver: bridge
